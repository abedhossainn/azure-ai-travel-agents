name: Build & Deploy Full Stack

on:
  push:
    branches:
      - main
      - ai-travel-agent-phase2
  pull_request:
    branches:
      - main
      - ai-travel-agent-phase2

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build TypeScript
        run: npm run build --workspace=packages/api
      
      - name: Verify build
        run: |
          echo "✅ TypeScript compilation successful"
          ls -la packages/api/dist/ | head -20
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.ref == 'refs/heads/ai-travel-agent-phase2'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Railway
        run: |
          echo "🚀 Railway Full Stack Deployment"
          echo "================================"
          echo "Services deploying:"
          echo "  ✓ API (Node.js + Genkit)"
          echo "  ✓ OpenWebUI (Frontend)"
          echo "  ✓ Redis (Cache)"
          echo ""
          echo "Railway auto-deploys on push."
          echo "Monitor your Railway dashboard for deployment status."
          echo ""
          echo "Access your services:"
          echo "  🌐 Frontend: https://your-railway-app.up.railway.app/"
          echo "  📡 API: https://your-railway-app.up.railway.app/api/v2/chat"
          echo "  ⚙️  Health: https://your-railway-app.up.railway.app/api/health"
