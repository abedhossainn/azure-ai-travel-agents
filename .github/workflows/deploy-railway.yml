name: Build & Test on Push

on:
  push:
    branches:
      - main
      - ai-travel-agent-phase2
  pull_request:
    branches:
      - main
      - ai-travel-agent-phase2

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build TypeScript
        run: npm run build --workspace=packages/api
      
      - name: Verify build
        run: ls -la packages/api/dist/
  
  notify:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.ref == 'refs/heads/ai-travel-agent-phase2'
    
    steps:
      - name: Build Success
        run: |
          echo "✅ Build successful!"
          echo "🚀 Railway will auto-deploy this commit"
          echo "📊 Check your Railway dashboard for deployment status"
