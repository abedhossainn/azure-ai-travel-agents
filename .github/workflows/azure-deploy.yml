name: Deploy to Azure Container Instances

on:
  push:
    branches:
      - ai-travel-agent-phase2
  pull_request:
    branches:
      - ai-travel-agent-phase2

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
  REGISTRY_USERNAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.AZURE_REGISTRY_PASSWORD }}
  IMAGE_NAME: travel-agent-api
  ACR_NAME: travelagentacr13864

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build TypeScript
        run: npm run build --workspace=packages/api
      
      - name: Verify build
        run: |
          echo "✅ TypeScript compilation successful"
          ls -la packages/api/dist/ | head -20

  build-and-push:
    runs-on: ubuntu-latest
    needs: build
    if: success() && github.ref == 'refs/heads/ai-travel-agent-phase2'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Get ACR credentials
        id: acr_creds
        run: |
          echo "acr_username=${{ secrets.AZURE_REGISTRY_USERNAME }}" >> $GITHUB_OUTPUT
          echo "acr_password=${{ secrets.AZURE_REGISTRY_PASSWORD }}" >> $GITHUB_OUTPUT
          echo "acr_login_server=${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}" >> $GITHUB_OUTPUT
      
      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr_creds.outputs.acr_login_server }}
          username: ${{ steps.acr_creds.outputs.acr_username }}
          password: ${{ steps.acr_creds.outputs.acr_password }}
      
      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.acr_creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.acr_creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.acr_creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ steps.acr_creds.outputs.acr_login_server }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
      
      - name: Deploy Bicep template to Azure
        run: |
          az deployment group create \
            --name "travel-agent-deployment-${{ github.run_number }}" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters \
              acrName="${{ env.ACR_NAME }}" \
              acrUsername="${{ secrets.AZURE_REGISTRY_USERNAME }}" \
              acrPassword="${{ secrets.AZURE_REGISTRY_PASSWORD }}" \
              apiImageName="${{ env.IMAGE_NAME }}" \
              apiImageTag="latest" \
              googleGenaiApiKey="${{ secrets.GOOGLE_GENAI_API_KEY }}" \
              amadeusClientId="${{ secrets.AMADEUS_CLIENT_ID }}" \
              amadeusClientSecret="${{ secrets.AMADEUS_CLIENT_SECRET }}"
      
      - name: Get deployment outputs
        id: deployment_outputs
        run: |
          OUTPUTS=$(az deployment group show \
            --name "travel-agent-deployment-${{ github.run_number }}" \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.outputs)
          
          API_URL=$(echo "$OUTPUTS" | jq -r '.apiUrl.value')
          UI_URL=$(echo "$OUTPUTS" | jq -r '.uiUrl.value')
          ACR_LOGIN=$(echo "$OUTPUTS" | jq -r '.acrLoginServer.value')
          
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "ui_url=$UI_URL" >> $GITHUB_OUTPUT
          echo "acr_login=$ACR_LOGIN" >> $GITHUB_OUTPUT
      
      - name: Print deployment summary
        run: |
          echo "🚀 Deployment successful!"
          echo ""
          echo "📊 Deployment Details:"
          echo "  🏗️  ACR Login Server: ${{ steps.deployment_outputs.outputs.acr_login }}"
          echo "  📡 API URL: ${{ steps.deployment_outputs.outputs.api_url }}"
          echo "  🌐 UI URL: ${{ steps.deployment_outputs.outputs.ui_url }}"
          echo ""
          echo "📈 Next Steps:"
          echo "  1. Wait 1-2 minutes for containers to start"
          echo "  2. Access the UI: ${{ steps.deployment_outputs.outputs.ui_url }}"
          echo "  3. Check API health: ${{ steps.deployment_outputs.outputs.api_url }}/api/health"

  azure-logout:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    
    steps:
      - name: Azure logout
        uses: azure/logout@v1
