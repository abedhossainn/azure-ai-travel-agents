# Railway Multi-Service Configuration for Travel Agent Platform
# This configuration deploys API, OpenWebUI, and Redis services

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
dockerfileContext = "."

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# API Service - Main orchestration engine
[[services]]
name = "api"
buildCommand = "npm install && npm run build"
startCommand = "node dist/index.js"
port = 4000
healthcheckPath = "/api/health"
healthcheckTimeout = 30
healthcheckInterval = 10

[services.env]
NODE_ENV = "production"
LLM_PROVIDER = "gemini"
MODEL = "gemini-2.0-flash-lite"
REDIS_URL = "${{ Redis.REDIS_URL }}"
PORT = "4000"

[services.volumes]
name = "api-logs"
mountPath = "/app/logs"

# Redis Service - Cache layer
[[services]]
name = "redis"
image = "redis:7-alpine"
port = 6379
startCommand = "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru"
restartPolicyType = "on_failure"

[services.volumes]
name = "redis-data"
mountPath = "/data"

# OpenWebUI Service - Frontend
[[services]]
name = "openwebui"
image = "ghcr.io/open-webui/open-webui:main"
port = 8080
restartPolicyType = "on_failure"

[services.env]
OPENAI_API_BASE_URL = "http://${{ api.RAILWAY_PUBLIC_DOMAIN }}/v1"
OPENAI_API_KEY = "sk-dummy"
WEBUI_NAME = "Travel Agent"
WEBUI_AUTH = "false"

[services.volumes]
name = "openwebui-data"
mountPath = "/app/backend/data"
