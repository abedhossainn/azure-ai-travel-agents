version: '3.8'

services:
  # Redis cache for Amadeus API responses
  redis:
    image: redis:7-alpine
    container_name: travel-agent-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - travel-agent-network

  # API service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-agent-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - LLM_PROVIDER=gemini
      - MODEL=gemini-2.5-flash-lite
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - travel-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Open WebUI - Travel Agent frontend
  frontend:
    image: ghcr.io/open-webui/open-webui:main
    container_name: travel-agent-ui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://api:4000/v1
      - OPENAI_API_KEY=sk-dummy
      - WEBUI_NAME=Travel Agent
      - WEBUI_URL=http://localhost:3000
      - WEBUI_AUTH=true
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - travel-agent-network

volumes:
  redis-data:
    driver: local
  open-webui:
    driver: local

networks:
  travel-agent-network:
    driver: bridge
